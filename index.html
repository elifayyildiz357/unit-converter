<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit Converter</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f7;
      color: #1a1a1a;
      margin: 0;
      padding: 24px 16px;
    }
    main {
      max-width: 420px;
      margin: 40px auto;
      background: #ffffff;
      border: 1px solid #d0d5d8;
      border-radius: 10px;
      padding: 24px;
    }
    h1 { margin-top: 0; font-size: 1.6rem; }
    p.note { color: #555; font-size: 0.95rem; }
    label { display: block; margin: 16px 0 6px; font-weight: bold; }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      font-size: 1.1rem;
      padding: 10px;
      border: 1px solid #8a9296;
      border-radius: 6px;
    }
    button {
      margin-top: 20px;
      background: #1f4e79;
      color: #ffffff;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #163a5b; }
    #result {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 1.5em;
    }
    #result.error { color: #b00020; }
  </style>
</head>
<body>
  <main>
    <h1>Unit Converter</h1>
    <p class="note">Kilometers and miles, kilograms and pounds, Celsius and Fahrenheit.</p>

    <form id="converter-form">
      <label for="value">Number</label>
      <input id="value" type="number" step="any" placeholder="Type a number">

      <label for="direction">Convert</label>
      <select id="direction">
        <option value="km-to-miles">Kilometers to miles</option>
        <option value="miles-to-km">Miles to kilometers</option>
        <option value="kg-to-lb">Kilograms to pounds</option>
        <option value="lb-to-kg">Pounds to kilograms</option>
        <option value="c-to-f">Celsius to Fahrenheit</option>
        <option value="f-to-c">Fahrenheit to Celsius</option>
      </select>

      <button type="submit">Convert</button>
    </form>

    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    var form = document.getElementById("converter-form");
    var input = document.getElementById("value");
    var direction = document.getElementById("direction");
    var result = document.getElementById("result");

    var MAX_NUMBER = 1000000000;

    // Which units each direction uses, for the result text.
    var labels = {
      "km-to-miles": ["km", "miles"],
      "miles-to-km": ["miles", "km"],
      "kg-to-lb": ["kg", "lb"],
      "lb-to-kg": ["lb", "kg"],
      "c-to-f": ["\u00B0C", "\u00B0F"],
      "f-to-c": ["\u00B0F", "\u00B0C"]
    };

    function convert(dir, number) {
      if (dir === "km-to-miles") {
        return number * 0.7;
      } else if (dir === "miles-to-km") {
        return number / 0.621371;
      } else if (dir === "kg-to-lb") {
        return number * 2.20462;
      } else if (dir === "lb-to-kg") {
        return number / 2.20462;
      } else if (dir === "c-to-f") {
        return number * 1.8 + 32;
      } else {
        return (number - 32) / 1.8;
      }
    }

    function showError(message) {
      result.className = "error";
      result.textContent = message;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      // Check 1: the box must not be empty.
      if (input.value === "") {
        showError("Please type a number.");
        return;
      }

      var number = Number(input.value);

      // Check 2: it must be a real number, not NaN or Infinity.
      if (!isFinite(number)) {
        showError("Please type a valid number.");
        return;
      }

      // Check 3: it must not be too big.
      if (Math.abs(number) > MAX_NUMBER) {
        showError("The number is too big. Use a number up to 1,000,000,000.");
        return;
      }

      var answer = convert(direction.value, number);
      var unit = labels[direction.value];

      result.className = "";
      result.textContent = number + " " + unit[0] + " = " + Number(answer.toFixed(4)) + " " + unit[1];
    });
  </script>
</body>
</html>
