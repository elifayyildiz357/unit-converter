<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit Converter</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f7;
      color: #1a1a1a;
      margin: 0;
      padding: 24px 16px;
    }
    main {
      max-width: 420px;
      margin: 40px auto;
      background: #ffffff;
      border: 1px solid #d0d5d8;
      border-radius: 10px;
      padding: 24px;
    }
    h1 { margin-top: 0; font-size: 1.6rem; }
    p.note { color: #555; font-size: 0.95rem; }
    label { display: block; margin: 16px 0 6px; font-weight: bold; }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      font-size: 1.1rem;
      padding: 10px;
      border: 1px solid #8a9296;
      border-radius: 6px;
    }
    button {
      margin-top: 20px;
      background: #1f4e79;
      color: #ffffff;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #163a5b; }
    #result {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 1.5em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Unit Converter</h1>
    <p class="note">Version 1: kilometers and miles. More units are coming.</p>

    <form id="converter-form">
      <label for="value">Number</label>
      <input id="value" type="number" step="any" placeholder="Type a number">

      <label for="direction">Convert</label>
      <select id="direction">
        <option value="km-to-miles">Kilometers to miles</option>
        <option value="miles-to-km">Miles to kilometers</option>
      </select>

      <button type="submit">Convert</button>
    </form>

    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    var form = document.getElementById("converter-form");
    var input = document.getElementById("value");
    var direction = document.getElementById("direction");
    var result = document.getElementById("result");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      // Basic check: the box must not be empty.
      if (input.value === "") {
        result.textContent = "Please type a number.";
        return;
      }

      var number = Number(input.value);
      var answer;

      if (direction.value === "km-to-miles") {
        answer = number * 0.621371;
        result.textContent = number + " km = " + Number(answer.toFixed(4)) + " miles";
      } else {
        answer = number / 0.621371;
        result.textContent = number + " miles = " + Number(answer.toFixed(4)) + " km";
      }
    });
  </script>
</body>
</html>
